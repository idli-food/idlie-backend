# /etc/nginx/sites-available/api.idli.food.conf
# ln -s /etc/nginx/sites-available/api.idli.food.conf /etc/nginx/sites-enabled/
# Assumes the `web` container publishes gunicorn on 127.0.0.1:8000 (docker-compose port "8000:8000").

upstream idlie_backend {
    server 127.0.0.1:8000;
}

# HTTP -> HTTPS redirect (also serves the ACME challenge for certbot)
server {
    listen 80;
    listen [::]:80;
    server_name api.idli.food;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / { 
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.idli.food;

    ssl_certificate     /etc/letsencrypt/live/api.idli.food/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.idli.food/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Allow large media uploads (posts / hotel images)
    client_max_body_size 25M;

    access_log /var/log/nginx/api.idli.food.access.log;
    error_log  /var/log/nginx/api.idli.food.error.log;

    location / {
        proxy_pass http://idlie_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
